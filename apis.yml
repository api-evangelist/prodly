aid: prodly
name: Prodly
description: >-
  Prodly is an end-to-end DevOps platform for Salesforce that version-controls, tests,
  and deploys both data and metadata between Salesforce orgs. It specializes in the
  complex relational configuration data behind Salesforce CPQ, Agentforce Revenue
  Management (ARM), and Field Service Lightning, and adds work-management integrations
  (Jira, Azure DevOps), version-control integration, scratch-org provisioning, and SOX
  compliance automation. Prodly exposes automation through first-party CLI plugins on
  the Salesforce CLI (the paid "Prodly APIs + CLI" add-on) rather than a public REST API.
  Founded in Palo Alto, CA and backed by Norwest Venture Partners.
